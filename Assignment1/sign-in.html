<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Page</title>
    <link rel="stylesheet" href="sign-in.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
    <nav>
      <a href="Index.html">Home Page</a>
      <a href="form.html">Sign Up</a>
    </nav>

    <div class="container">
      <div class="first-container">
        <img class="main-image" src="./assets/picture.svg" alt="" />

        <h1 class="heading">Make the Next Career Move for You.</h1>

        <footer>
          <img src="./assets/x.svg" alt="" />
          <img src="./assets/instagram.svg" alt="" />
          <img src="./assets/fb.svg" alt="" />
          <img src="./assets/in.svg" alt="" />

          <p>2025 &#169; AltSchool Africa. All rights reserved.</p>
        </footer>
      </div>
      <div class="second-container">
        
          <p class="altschoolar">
            Not an AltSchooler yet? <a href="form.html"> Register Now! </a>
          </p>

          
       
        <div class="forms">
          <h2>Sign In</h2>
          <p class="take-next-step">
            Enter your email address and password to securely log in to
            AltSchool Admin Portal
          </p>
          <form action="">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="Email" />
            <div class="password">
              <label for="password">Password</label>
              <input type="text" id="password" name="password" placeholder="Password" />
              <i class="fa fa-eye" id="toggle_password"></i>
             <p>Must be at least 8 characters</p>
            </div> 
          </form>
          <button type="submit">Proceed to Dashboard  &#x1F862</button>
        <p class="terms"> Forgot Password? <a href=""> Reset Now!</a> </p>
         
        </div>
        
        
      </div>
    </div>
  </body>
</html>
